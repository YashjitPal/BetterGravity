name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows and macOS are primary runtime platforms; Linux is the fast signal.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    # Proves packaged installers build on their target platforms.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: installer-windows
            build: pnpm build:installer:win
            path: release*/*.exe
          - os: macos-latest
            name: installer-macos
            build: pnpm build:installer:mac
            path: release*/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # Matches directories.output in apps/installer/package.json. Kept as a
          # glob so the two cannot silently disagree again; if-no-files-found
          # turns any future mismatch into a failure rather than a silent skip.
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
