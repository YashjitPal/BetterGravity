name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The patcher only ever runs on Windows, so Windows is the platform that
    # matters. Linux is kept as the fast signal and to catch path assumptions.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    # Proves the portable executable still builds. Only meaningful on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          # Matches directories.output in apps/installer/package.json. Kept as a
          # glob so the two cannot silently disagree again; if-no-files-found
          # turns any future mismatch into a failure rather than a silent skip.
          path: release*/*.exe
          if-no-files-found: error
          retention-days: 7
