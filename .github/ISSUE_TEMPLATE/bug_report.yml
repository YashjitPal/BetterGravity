name: Bug report
description: Something in BetterGravity does not work
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include tokens, credentials, conversation contents, or
        other personal Antigravity data. If this is a security vulnerability,
        report it privately instead — see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: BetterGravity version
      description: Shown at the top of Settings → BetterGravity.
      placeholder: "0.1.3"
    validations:
      required: true

  - type: input
    id: host-version
    attributes:
      label: Antigravity version
      placeholder: "2.11.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Installer
        - Settings section inside Antigravity
        - A theme
        - A plugin
        - Updating or reapplying
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → BetterGravity
        2. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Runtime log
      description: >
        Relevant lines from %APPDATA%\BetterGravity\runtime.log, if the problem
        is inside Antigravity. Check it for anything personal before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest BetterGravity release
          required: true
        - label: I have removed anything personal from what I pasted
          required: true
