name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it belong?
      options: [Installer, In-client runtime, Plugin API, Theme API, Marketplace, Documentation]
    validations:
      required: true
